name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          base=$(sed -nE 's/^project\(Opal VERSION ([0-9]+\.[0-9]+)\.[0-9]+.*/\1/p' CMakeLists.txt)
          last=$(git tag --list "v${base}.*" | sed "s/^v${base}\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
          if [ -z "$last" ]; then patch=0; else patch=$((last + 1)); fi
          echo "version=${base}.${patch}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${base}.${patch}"

      - name: Configure
        run: cmake -B build -A x64 -DOPAL_VERSION="${VERSION}"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: |
          mkdir release
          cp build/Release/Opal.exe "release/Opal-${VERSION}.exe"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publish release
        run: gh release create "v${VERSION}" release/* --target "$GITHUB_SHA" --title "v${VERSION}" --generate-notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
